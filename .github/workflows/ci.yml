name: CI

# Construit l'APK debug et lance les tests unitaires (Robolectric) à chaque push sur main
# et à chaque pull request. Sert de garde-fou avant la fusion.
#
# Le lint n'est volontairement pas une barrière : le projet porte déjà des avertissements
# MissingTranslation, qui feraient échouer la CI sans rapport avec la PR en cours.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Annule les exécutions précédentes de la même branche / PR.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer le SDK Android (déjà présent sur le runner)
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.2" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Construire et tester
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Publier le rapport de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
